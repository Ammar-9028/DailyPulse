
name: DailyPulse Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Website
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/script.js
          mkdir -p build
          cp index.html build/
          cp -r css js build/
          echo "Build Successful"

      - name: Deploy to EC2
        run: |
          sudo cp -r build/* /var/www/html/
          echo "Deployment Successful"
