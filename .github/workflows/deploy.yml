name: DailyPulse CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Deploy website
        run: |
          cp -r index.html css js /var/www/html/
          echo "DailyPulse deployed successfully"
